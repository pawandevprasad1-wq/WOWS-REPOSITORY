<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudinary Auto Uploader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; font-size: 20px; }
        .file-label { display: block; border: 2px dashed #007bff; padding: 20px; border-radius: 8px; cursor: pointer; color: #007bff; font-weight: 600; margin-bottom: 15px; background: #f8faff; }
        input[type="file"] { display: none; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #0056b3; }
        #status { margin-top: 15px; font-size: 14px; color: #555; font-weight: 600; }
        
        /* Updated Result CSS */
        .url-box { margin-top: 20px; text-align: left; }
        .url-item { background: #f8f9fa; border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
        .url-text { font-size: 13px; color: #333; word-break: break-all; display: block; margin-bottom: 8px; font-family: monospace; }
        .copy-btn { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-size: 13px; cursor: pointer; width: 100%; font-weight: bold; }
        .copy-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h2>Cloudinary Image Uploader</h2>
    <form id="uploadForm">
        <label for="photoInput" class="file-label" id="fileLabel">Select Photos</label>
        <input type="file" id="photoInput" multiple accept="image/*">
        <button type="submit">Upload to Cloudinary</button>
    </form>

    <div id="status"></div>
    <div id="result" class="url-box"></div>
</div>

<script>
const fileInput = document.getElementById('photoInput');
const fileLabel = document.getElementById('fileLabel');

fileInput.addEventListener('change', () => {
    const count = fileInput.files.length;
    fileLabel.innerText = count > 0 ? `${count} Image(s) Selected` : 'Select Photos';
});

document.getElementById('uploadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    
    if (fileInput.files.length === 0) {
        alert("Pehle photos select karein!");
        return;
    }

    const formData = new FormData();
    for (let i = 0; i < fileInput.files.length; i++) {
        formData.append('photos', fileInput.files[i]);
    }

    statusDiv.innerText = "Uploading photos to Cloudinary...";
    resultDiv.innerHTML = "";

    try {
        const response = await fetch('/upload', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (response.ok) {
            statusDiv.innerText = "Upload Complete!";
            data.urls.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'url-item';
                div.innerHTML = `
                    <span class="url-text" id="url-${index}">${url}</span>
                    <button class="copy-btn" onclick="copyUrl('url-${index}', this)">Copy URL</button>
                `;
                resultDiv.appendChild(div);
            });
        } else {
            statusDiv.innerText = "Error: " + (data.error || "Upload failed");
        }

    } catch (error) {
        statusDiv.innerText = "Upload Failed! Please try again.";
    }
});

function copyUrl(id, btn) {
    const text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text).then(() => {
        btn.innerText = "Copied!";
        btn.style.background = "#17a2b8";
        setTimeout(() => {
            btn.innerText = "Copy URL";
            btn.style.background = "#28a745";
        }, 2000);
    });
}
</script>

</body>
</html>
