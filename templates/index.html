<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudinary Serial Uploader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; font-size: 20px; }
        .file-label { display: block; border: 2px dashed #007bff; padding: 20px; border-radius: 8px; cursor: pointer; color: #007bff; font-weight: 600; }
        input[type="file"] { display: none; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; }
        button:hover { background: #0056b3; }
        #status { margin-top: 15px; font-size: 14px; color: #555; font-weight: 600; }

        .url-box { margin-top: 20px; text-align: left; }
        .url-item { background: #f8f9fa; border: 1px solid #ddd; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
        .url-text { font-size: 13px; color: #333; word-break: break-all; display: block; margin-bottom: 8px; font-family: monospace; }
        .copy-btn { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; width: auto; margin-top: 0; }
        .copy-btn:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Cloudinary Media Uploader</h2>
        <form id="uploadForm">
            <label for="photoInput" class="file-label" id="fileLabel">Select Photos or Videos</label>
            <input type="file" id="photoInput" multiple accept="image/*,video/*">
            <button type="submit">Upload to Cloudinary</button>
        </form>

        <div id="status"></div>
        <div id="result" class="url-box"></div>
    </div>

    <script>
        const photoInput = document.getElementById('photoInput');
        const fileLabel = document.getElementById('fileLabel');

        photoInput.addEventListener('change', () => {
            const count = photoInput.files.length;
            fileLabel.innerText = count > 0 ? `${count} File(s) Selected` : 'Select Photos or Videos';
        });

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');

            if (photoInput.files.length === 0) {
                alert("Pehle files select karein!");
                return;
            }

            const formData = new FormData();
            
            // Array.from se exact user selection order preserve hota hai
            const selectedFiles = Array.from(photoInput.files);
            selectedFiles.forEach(file => {
                formData.append('photos', file);
            });

            statusDiv.innerText = "Uploading files in serial order...";
            resultDiv.innerHTML = "";

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.innerText = "Upload Complete!";
                    data.urls.forEach((url, index) => {
                        const div = document.createElement('div');
                        div.className = 'url-item';
                        div.innerHTML = `
                            <span class="url-text"><b>#${index + 1}:</b> ${url}</span>
                            <button class="copy-btn" onclick="navigator.clipboard.writeText('${url}')">Copy URL</button>
                        `;
                        resultDiv.appendChild(div);
                    });
                } else {
                    statusDiv.innerText = "Error: " + (data.error || "Upload failed");
                }
            } catch (err) {
                statusDiv.innerText = "Upload failed. Check connection.";
            }
        });
    </script>
</body>
</html>
