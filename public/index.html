<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudinary File Uploader</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .upload-card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    input[type="file"] { margin: 15px 0; width: 100%; }
    button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
    button:disabled { background: #a0c4ff; cursor: not-allowed; }
    #status { margin-top: 15px; font-size: 14px; color: #555; }
    .result-box { margin-top: 15px; display: none; background: #eef2f5; padding: 10px; border-radius: 6px; word-break: break-all; }
    .copy-btn { background: #28a745; margin-top: 8px; }
    .copy-btn:hover { background: #218838; }
  </style>
</head>
<body>

<div class="upload-card">
  <h2>Cloudinary Uploader</h2>
  <input type="file" id="fileInput" accept="image/*,video/*">
  <button id="uploadBtn" onclick="uploadFile()">Upload Karein</button>

  <div id="status"></div>

  <div id="resultBox" class="result-box">
    <p id="fileUrl" style="margin: 5px 0; font-size: 13px;"></p>
    <button class="copy-btn" onclick="copyUrl()">Copy URL</button>
  </div>
</div>

<script>
  async function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    const statusDiv = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileUrl = document.getElementById('fileUrl');

    if (!fileInput.files.length) {
      alert("Pehle file select karein!");
      return;
    }

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);

    uploadBtn.disabled = true;
    statusDiv.innerText = "Uploading... Kripya intazar karein.";
    resultBox.style.display = "none";

    try {
      const res = await fetch('/api/upload', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();

      if (res.ok) {
        statusDiv.innerText = "Upload Safal Ho Gaya!";
        fileUrl.innerText = data.url;
        resultBox.style.display = "block";
      } else {
        statusDiv.innerText = "Error: " + data.error;
      }
    } catch (err) {
      statusDiv.innerText = "Server error. Kripya dobara try karein.";
    } finally {
      uploadBtn.disabled = false;
    }
  }

  function copyUrl() {
    const text = document.getElementById('fileUrl').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("URL Copy ho gaya!");
    });
  }
</script>

</body>
</html>
